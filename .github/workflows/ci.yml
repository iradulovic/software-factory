name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_identity:
    name: Resolve shared build identity
    runs-on: ubuntu-latest
    outputs:
      product_version: ${{ steps.identity.outputs.product_version }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      build_time_utc: ${{ steps.identity.outputs.build_time_utc }}
      build_state: ${{ steps.identity.outputs.build_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve exact-tag or development identity
        id: identity
        run: node scripts/factory-build-identity.mjs --github-output >> "$GITHUB_OUTPUT"

  backend:
    name: Backend build and tests
    needs: build_identity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: software_factory_tests
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory -d software_factory_tests"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      FACTORY_PRODUCT_VERSION: ${{ needs.build_identity.outputs.product_version }}
      FACTORY_SOURCE_COMMIT: ${{ needs.build_identity.outputs.source_commit }}
      FACTORY_BUILD_TIME_UTC: ${{ needs.build_identity.outputs.build_time_utc }}
      FACTORY_BUILD_STATE: ${{ needs.build_identity.outputs.build_state }}
      # Local-only service-container credentials; the PostgreSQL integration tests run instead of being skipped.
      FACTORY_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=software_factory_tests;Username=factory;Password=factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SoftwareFactory.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build SoftwareFactory.slnx --no-restore --configuration Release
      - name: Test
        # API and integration test projects share PostgreSQL fixtures; run projects sequentially.
        run: dotnet test SoftwareFactory.slnx --no-build --configuration Release -m:1 --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, type-check, and build
    needs: build_identity
    runs-on: ubuntu-latest
    env:
      FACTORY_PRODUCT_VERSION: ${{ needs.build_identity.outputs.product_version }}
      FACTORY_SOURCE_COMMIT: ${{ needs.build_identity.outputs.source_commit }}
      FACTORY_BUILD_TIME_UTC: ${{ needs.build_identity.outputs.build_time_utc }}
      FACTORY_BUILD_STATE: ${{ needs.build_identity.outputs.build_state }}
    defaults:
      run:
        working-directory: web/Factory.Web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/Factory.Web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build
